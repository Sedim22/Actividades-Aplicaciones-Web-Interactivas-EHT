<!doctype html>
<html lang="es" data-bs-theme="light">
    <head>
        <title>MovieReviews - Detalle de Película</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    </head>

    <body class="bg-light min-vh-100 d-flex flex-column justify-content-between">

        <nav class="navbar navbar-expand-sm navbar-dark bg-dark p-md-3">
            <div class="container">
                <a class="navbar-brand" href="index.html"> 
                    <strong><span class="text-primary"><i class="bi bi-camera-reels"></i> Movie</span>Reviews</strong>
                </a>
                <button
                    class="navbar-toggler d-lg-none"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#collapsibleNavId"
                    aria-controls="collapsibleNavId"
                    aria-expanded="false"
                    aria-label="Toggle navigation"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>
                
                <div class="collapse navbar-collapse justify-content-end" id="collapsibleNavId">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">
                                <i class="bi bi-house"></i> Inicio
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link role-button"
                               style="cursor: pointer;"
                               data-bs-toggle="modal"
                               data-bs-target="#modalFav"
                            > 
                                <i class="bi bi-heart-fill text-danger"></i> Favoritos 
                                <span class="badge rounded-pill text-bg-danger fav-count">0</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <main class="container my-5">
            <!-- Spinner de Carga -->
            <div id="loading-spinner" class="text-center py-5">
                <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
                    <span class="visually-hidden">Cargando...</span>
                </div>
                <p class="mt-2 text-muted fw-bold">Cargando información de la película...</p>
            </div>

            <!-- Contenedor del Detalle de Película -->
            <div id="movie-detail" style="display: none;"></div>
        </main>

        <footer class="container-fluid bg-dark mt-auto">
            <p class="lead text-white text-center p-4 m-0">© MovieReviews</p>
        </footer>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>        
        <script type="module" src="review.js"></script>
    </body>
</html>
