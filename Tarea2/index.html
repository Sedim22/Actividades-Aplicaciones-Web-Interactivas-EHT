<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    </head>

    <body>
        <div class="d-flex flex-column align-items-center justify-content-center vh-100">

            <div class="border border-primary p-3 rounded-3 m-3 d-block d-sm-none d-flex flex-column justify-content-center align-items-center">
                <img src="profile.jpg" alt="" class="rounded-circle w-50 center mx-auto d-block shadow-lg" >
                <p class="display-4 text-primary fw-bold text-center m-2">Eduardo Hernández Torres</p>
                <p class="display-6 text-muted text-center m-2">Developer</p>
                <div class="d-flex justify-content-center align-items-center m-2">
                    <ul class="list-inline">
                        <li class="list-inline-item"><span class="badge bg-primary">React</span></li>
                        <li class="list-inline-item"><span class="badge bg-success">C#</span></li>
                        <li class="list-inline-item"><span class="badge bg-warning">C++</span></li>
                    </ul>
                </div>
                <button
                        type="button"
                        class="btn btn-outline-primary w-75"
                    >
                    <i class="bi bi-envelope"></i>
                        Contactar
                </button>
            </div>

            <div class="border border-primary rounded-3 d-none d-md-flex d-md-row p-1 h-75 m-3">
                <div class="d-flex justify-content-center align-items-center">
                    <img src="profile.jpg" alt="" class="rounded-circle w-50 center mx-auto d-block shadow-lg" >
                </div>

                <div class="d-flex flex-column justify-content-center align-items-center">
                    <p class="display-4 text-primary fw-bold text-center m-2">Eduardo</p>
                    <p class="display-4 text-primary fw-bold text-center m-2">Hernández Torres</p>
                    <p class="display-6 text-muted text-center m-2">Developer</p>
                    <div class="d-flex justify-content-center align-items-center">
                        <ul class="list-inline">
                            <li class="list-inline-item"><span class="badge bg-primary">React</span></li>
                            <li class="list-inline-item"><span class="badge bg-success">C#</span></li>
                            <li class="list-inline-item"><span class="badge bg-warning">C++</span></li>
                        </ul>
                    </div>
                    <button
                            type="button"
                            class="btn btn-outline-primary w-50"
                        >
                        <i class="bi bi-envelope"></i>
                            Contactar
                    </button>
                </div>
            </div>

        </div>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
